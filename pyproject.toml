[project]
name = "cbm-map"
version = "0.1.0"
description = "SkilledDragon minilab: build DeusData/codebase-memory-mcp at pin and map a local fixture graph"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SkilledDragon LLC", email = "hello@skilleddragon.com" }]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
cbm-map = "cbm_map.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbm_map"]

[tool.hatch.build.targets.wheel.sources]
"src/cbm_map" = "cbm_map"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "binary: requires a built vendor/codebase-memory-mcp binary",
]
